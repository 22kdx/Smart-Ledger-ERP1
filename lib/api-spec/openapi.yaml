openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Internal user authentication
  - name: companies
    description: Company workspace operations
  - name: settings
    description: Company profile and currency settings
  - name: accounting
    description: Chart of accounts and double-entry journals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerAuthUser
      tags: [auth]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid registration details
        "409":
          description: Email is already registered
        "429":
          description: Too many requests
        "503":
          description: Authentication storage is unavailable
  /auth/login:
    post:
      operationId: loginAuthUser
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialsInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid request
        "401":
          description: Invalid credentials or temporary lock
        "429":
          description: Too many requests
        "503":
          description: Authentication storage is unavailable
  /auth/refresh:
    post:
      operationId: refreshAuthSession
      tags: [auth]
      summary: Rotate the refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Session tokens rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid request
        "401":
          description: Refresh token is invalid, expired, or revoked
        "429":
          description: Too many requests
        "503":
          description: Authentication storage is unavailable
  /auth/logout:
    post:
      operationId: logoutAuthUser
      tags: [auth]
      summary: Revoke a refresh token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Refresh session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
        "400":
          description: Invalid request
        "429":
          description: Too many requests
        "503":
          description: Authentication storage is unavailable
  /auth/me:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Return the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Missing or invalid access token
        "503":
          description: Authentication storage is unavailable
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies available to the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company memberships
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company and make the current user its owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreate"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid company details
  /companies/{companyId}/accounts:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAccounts
      tags: [accounting]
      summary: List a company's chart of accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "403":
          description: Not a member of this company
    post:
      operationId: createAccount
      tags: [accounting]
      summary: Add an account to the chart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid account details
        "409":
          description: Duplicate account code or invalid parent account
        "403":
          description: Insufficient company role
  /companies/{companyId}/accounts/{accountId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateAccount
      tags: [accounting]
      summary: Update or deactivate a chart account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid account update
        "403":
          description: Insufficient company role
        "404":
          description: Account not found
        "409":
          description: Account has posted activity or invalid parent
  /companies/{companyId}/journals:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listJournalEntries
      tags: [accounting]
      summary: List journal entries
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, posted, reversed]
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Journal entries with lines
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntry"
        "403":
          description: Not a member of this company
    post:
      operationId: createJournalEntry
      tags: [accounting]
      summary: Create a journal entry draft
      description: Create a draft. Posting is a separate action; posted entries are immutable and corrections require a reversing entry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryCreate"
      responses:
        "201":
          description: Journal draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Invalid journal draft
        "403":
          description: Insufficient company role
  /companies/{companyId}/journals/{journalEntryId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: journalEntryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getJournalEntry
      tags: [accounting]
      summary: Get a journal entry and its lines
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Journal entry not found
    patch:
      operationId: updateJournalEntry
      tags: [accounting]
      summary: Update a draft journal entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Updated journal draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Invalid draft
        "404":
          description: Draft not found
        "409":
          description: Posted entries are immutable
    delete:
      operationId: deleteJournalEntry
      tags: [accounting]
      summary: Delete a draft journal entry
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Draft deleted
        "404":
          description: Draft not found
        "409":
          description: Posted entries cannot be deleted
  /companies/{companyId}/journals/{journalEntryId}/post:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: journalEntryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: postJournalEntry
      tags: [accounting]
      summary: Validate and post a balanced draft
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Posted journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Draft not found
        "409":
          description: Unbalanced entry, closed period, inactive account, or invalid state
  /companies/{companyId}/journals/{journalEntryId}/reverse:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: journalEntryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reverseJournalEntry
      tags: [accounting]
      summary: Reverse a posted journal entry
      description: Creates an immutable opposite entry; the original is retained for audit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalReversalCreate"
      responses:
        "201":
          description: Reversal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Journal entry not found
        "409":
          description: Entry is not posted or has already been reversed
  /companies/{companyId}/ledger:
    get:
      operationId: getGeneralLedger
      tags: [accounting]
      summary: Read an account ledger for a date range
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: currency
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Currency"
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Account ledger and running balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralLedger"
        "404":
          description: Account not found
  /companies/{companyId}/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [accounting]
      summary: Read the trial balance as of a date
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: asOfDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        "200":
          description: Trial balance totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalance"
  /companies/{companyId}/accounting-periods:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAccountingPeriods
      tags: [accounting]
      summary: List accounting periods
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accounting periods
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountingPeriod"
    post:
      operationId: createAccountingPeriod
      tags: [accounting]
      summary: Create a non-overlapping accounting period
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingPeriodCreate"
      responses:
        "201":
          description: Accounting period created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingPeriod"
        "409":
          description: Period overlaps another period
  /companies/{companyId}/accounting-periods/{periodId}/close:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: periodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: closeAccountingPeriod
      tags: [accounting]
      summary: Close an accounting period with no draft entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Closed accounting period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingPeriod"
        "404":
          description: Period not found
        "409":
          description: Period already closed or still has drafts
  /companies/{companyId}/authorization:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompanyAuthorization
      tags: [companies]
      summary: Return current user's role and permissions for a company
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membership authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyAccess"
        "401":
          description: Missing or invalid access token
        "403":
          description: Not a member of this company
        "503":
          description: Authentication storage is unavailable
  /companies/{companyId}/settings:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompanySettings
      tags: [settings]
      summary: Read company profile and currency options
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
        "400":
          description: Invalid company identifier
        "401":
          description: Missing or invalid access token
        "403":
          description: Not a member of this company
        "404":
          description: Company not found
    patch:
      operationId: updateCompanySettings
      tags: [settings]
      summary: Update company profile and currency options
      description: Currency patches merge by code; omitted currencies remain unchanged. Does not calculate taxes or convert balances.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsUpdate"
      responses:
        "200":
          description: Updated company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
        "400":
          description: Invalid settings or base currency is not enabled
        "401":
          description: Missing or invalid access token
        "403":
          description: Insufficient company permission
        "404":
          description: Company not found
  /companies/{companyId}/members:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addCompanyMember
      tags: [companies]
      summary: Add an existing account to a company
      description: Requires members:manage permission. Only an owner may assign the admin role; owner cannot be assigned through this route.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyMemberCreate"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMember"
        "400":
          description: Invalid company or member details
        "403":
          description: Membership or role permission denied
        "404":
          description: Company or registered account not found
        "409":
          description: Account is already a member
  /companies/{companyId}/tax-rules:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listCompanyTaxRules
      tags: [settings]
      summary: List tax rules configured for a company
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company tax rules
          content:
            application/json:
              schema:
                type: object
                required: [taxRules]
                properties:
                  taxRules:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyTaxRule"
        "401":
          description: Missing or invalid access token
        "403":
          description: Not a member of this company
    post:
      operationId: createCompanyTaxRule
      tags: [settings]
      summary: Add a tax rule without applying it to documents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyTaxRuleCreate"
      responses:
        "201":
          description: Tax rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyTaxRule"
        "400":
          description: Invalid tax rule
        "401":
          description: Missing or invalid access token
        "403":
          description: Insufficient company permission
  /companies/{companyId}/tax-rules/{taxRuleId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taxRuleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCompanyTaxRule
      tags: [settings]
      summary: Update a tax rule's rate or active status
      description: Configuration only; historical documents are not changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyTaxRuleUpdate"
      responses:
        "200":
          description: Updated tax rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyTaxRule"
        "400":
          description: Invalid update
        "401":
          description: Missing or invalid access token
        "403":
          description: Insufficient company permission
        "404":
          description: Tax rule not found
  /companies/{companyId}/exchange-rates:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listCompanyExchangeRates
      tags: [settings]
      summary: List manually configured company exchange rates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company exchange rates
          content:
            application/json:
              schema:
                type: object
                required: [exchangeRates]
                properties:
                  exchangeRates:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyExchangeRate"
        "401":
          description: Missing or invalid access token
        "403":
          description: Not a member of this company
    post:
      operationId: createCompanyExchangeRate
      tags: [settings]
      summary: Add an exchange rate without converting balances
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyExchangeRateCreate"
      responses:
        "201":
          description: Exchange rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyExchangeRate"
        "400":
          description: Invalid exchange rate
        "401":
          description: Missing or invalid access token
        "403":
          description: Insufficient company permission
        "409":
          description: A rate already exists for this currency pair and date
  /companies/{companyId}/exchange-rates/{exchangeRateId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: exchangeRateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCompanyExchangeRate
      tags: [settings]
      summary: Remove an unused configured exchange rate
      description: Exchange rates are not yet applied to invoices, entries, or balances.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Exchange rate removed
        "401":
          description: Missing or invalid access token
        "403":
          description: Insufficient company permission
        "404":
          description: Exchange rate not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthRegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: Maximum 72 UTF-8 bytes because bcrypt is used.
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    AuthCredentialsInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 256
    AuthUser:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    AuthSession:
      type: object
      required: [user, accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          enum: [900]
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          enum: [2592000]
    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthLogoutResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    CompanyAccess:
      type: object
      required: [companyId, role, permissions]
      properties:
        companyId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, accountant, sales, purchasing, inventory, hr, viewer]
        permissions:
          type: array
          items:
            type: string
    CompanyMemberCreate:
      type: object
      required: [email, role]
      properties:
