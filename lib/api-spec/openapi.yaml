openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Internal user authentication
  - name: companies
    description: Company workspace operations
  - name: accounting
    description: Chart of accounts and double-entry journals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerAuthUser
      tags: [auth]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid registration details
        "409":
          description: Email is already registered
        "429":
          description: Too many requests
        "503":
          description: Authentication storage is unavailable
  /auth/login:
    post:
      operationId: loginAuthUser
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialsInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid request
        "401":
          description: Invalid credentials or temporary lock
        "429":
          description: Too many requests
        "503":
          description: Authentication storage is unavailable
  /auth/refresh:
    post:
      operationId: refreshAuthSession
      tags: [auth]
      summary: Rotate the refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Session tokens rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid request
        "401":
          description: Refresh token is invalid, expired, or revoked
        "429":
          description: Too many requests
        "503":
          description: Authentication storage is unavailable
  /auth/logout:
    post:
      operationId: logoutAuthUser
      tags: [auth]
      summary: Revoke a refresh token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Refresh session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
        "400":
          description: Invalid request
        "429":
          description: Too many requests
        "503":
          description: Authentication storage is unavailable
  /auth/me:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Return the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Missing or invalid access token
        "503":
          description: Authentication storage is unavailable
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies available to the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company memberships
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company and make the current user its owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreate"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid company details
  /companies/{companyId}/accounts:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAccounts
      tags: [accounting]
      summary: List a company's chart of accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "403":
          description: Not a member of this company
    post:
      operationId: createAccount
      tags: [accounting]
      summary: Add an account to the chart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid account details
        "403":
          description: Insufficient company role
  /companies/{companyId}/journals:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listJournalEntries
      tags: [accounting]
      summary: List posted journal entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Journal entries with lines
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntry"
        "403":
          description: Not a member of this company
    post:
      operationId: createJournalEntry
      tags: [accounting]
      summary: Post a balanced journal entry
      description: Posted entries are immutable; corrections must use a reversing entry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryCreate"
      responses:
        "201":
          description: Journal entry posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Unbalanced or invalid journal entry
        "403":
          description: Insufficient company role
  /companies/{companyId}/authorization:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompanyAuthorization
      tags: [companies]
      summary: Return current user's role and permissions for a company
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membership authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyAccess"
        "401":
          description: Missing or invalid access token
        "403":
          description: Not a member of this company
        "503":
          description: Authentication storage is unavailable
  /companies/{companyId}/members:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addCompanyMember
      tags: [companies]
      summary: Add an existing account to a company
      description: Requires members:manage permission. Only an owner may assign the admin role; owner cannot be assigned through this route.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyMemberCreate"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMember"
        "400":
          description: Invalid company or member details
        "403":
          description: Membership or role permission denied
        "404":
          description: Company or registered account not found
        "409":
          description: Account is already a member
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthRegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: Maximum 72 UTF-8 bytes because bcrypt is used.
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    AuthCredentialsInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 256
    AuthUser:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    AuthSession:
      type: object
      required: [user, accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          enum: [900]
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          enum: [2592000]
    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthLogoutResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    CompanyAccess:
      type: object
      required: [companyId, role, permissions]
      properties:
        companyId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, accountant, sales, purchasing, inventory, hr, viewer]
        permissions:
          type: array
          items:
            type: string
    CompanyMemberCreate:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum: [admin, accountant, sales, purchasing, inventory, hr, viewer]
    CompanyMember:
      type: object
      required: [userId, email, role]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, accountant, sales, purchasing, inventory, hr, viewer]
    AuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      description: "رمز عملة من ثلاثة أحرف، وتُحدد العملات المتاحة لكل منشأة من إعداداتها."
    CompanyCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        baseCurrency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
        taxRate:
          type: [number, "null"]
          minimum: 0
          maximum: 100
      required: [name]
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        countryCode:
          type: [string, "null"]
        baseCurrency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
        taxRate:
          type: [number, "null"]
        role:
          type: string
          enum: [owner, admin, accountant, sales, purchasing, inventory, hr, viewer]
      required: [id, name, baseCurrency, taxRate, role]
    AccountCreate:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 2
          maxLength: 160
        type:
          type: string
          enum: [asset, liability, equity, income, expense]
        parentAccountId:
          type: [string, "null"]
          format: uuid
      required: [code, name, type]
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [asset, liability, equity, income, expense]
        parentAccountId:
          type: [string, "null"]
        isSystem:
          type: boolean
        isActive:
          type: boolean
      required: [id, code, name, type, isSystem, isActive]
    JournalLineCreate:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        debit:
          type: number
          minimum: 0
        credit:
          type: number
          minimum: 0
        transactionCurrency:
          $ref: "#/components/schemas/Currency"
        transactionAmount:
          type: number
          minimum: 0
        exchangeRate:
          type: number
          exclusiveMinimum: 0
        memo:
          type: [string, "null"]
      required: [accountId, debit, credit, transactionCurrency, transactionAmount, exchangeRate]
    JournalLine:
      allOf:
        - $ref: "#/components/schemas/JournalLineCreate"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            accountCode:
              type: string
            accountName:
              type: string
          required: [id, accountCode, accountName]
    JournalEntryCreate:
      type: object
      properties:
        entryDate:
          type: string
          format: date
        description:
          type: string
          minLength: 2
          maxLength: 500
        reference:
          type: [string, "null"]
          maxLength: 100
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLineCreate"
      required: [entryDate, description, lines]
    JournalEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entryNumber:
          type: string
        entryDate:
          type: string
          format: date
        description:
          type: string
        reference:
          type: [string, "null"]
        status:
          type: string
          enum: [posted, reversed]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
      required: [id, entryNumber, entryDate, description, status, lines]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

